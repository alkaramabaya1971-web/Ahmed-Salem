kind = "web"
previewPath = "/"
title = "Ahmed Salem Photography"
description = "A polished Arabic RTL portfolio website for Riyadh-based wedding and event photographer Ahmed Salem, featuring curated work, transparent packages, and direct WhatsApp contact."
version = "1.0.0"
id = "artifacts/ahmed-salem-photography"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21211

[services.development]
run = "pnpm --filter @workspace/ahmed-salem-photography run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ahmed-salem-photography", "run", "build" ]
serve = "static"
publicDir = "artifacts/ahmed-salem-photography/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21211"
BASE_PATH = "/"
